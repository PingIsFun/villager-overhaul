name: Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Build all versions
        run: ./gradlew build

      - name: Collect artifacts
        run: ./gradlew buildAndCollect

      - name: Upload villager-overhaul jar
        uses: actions/upload-artifact@v7
        with:
          name: villager-overhaul-0.1.0-26.1-jar
          path: build/libs/0.1.0/villager-overhaul-0.1.0+26.1.jar
          if-no-files-found: error

      - name: Upload villager-overhaul sources jar
        uses: actions/upload-artifact@v7
        with:
          name: villager-overhaul-0.1.0-26.1-sources-jar
          path: build/libs/0.1.0/villager-overhaul-0.1.0+26.1-sources.jar
          if-no-files-found: error
